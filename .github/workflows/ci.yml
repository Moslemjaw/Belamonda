# Runs on every push and pull request. Mirrors the Render build (install:all + build),
# then runs the server tests against a throwaway in-memory MongoDB. Deploys are unaffected.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache the MongoDB binary the tests download on first use
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1

      - name: Install (same as Render)
        run: npm run install:all

      - name: Build shared, server and client (same as Render)
        run: npm run build

      - name: Server tests
        run: npm test --prefix server
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries
